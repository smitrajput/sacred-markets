# Sacred Foundry project. Run `forge build` / `forge test` from this directory
# (or from the repo root, whose foundry.toml points at the same layout).
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../lib", "../node_modules"]
remappings = [
  "forge-std/=../lib/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=../lib/v4-core/",
  "@uniswap/v4-periphery/=../lib/v4-periphery/",
  "permit2/=../lib/permit2/",
  "solmate/=../lib/solmate/",
]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
