# Sacred Foundry project. Run `forge build` / `forge test` from this directory
# (or from the repo root, whose foundry.toml points at the same layout).
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../lib", "../node_modules"]
remappings = [
  "forge-std/=../lib/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "@uniswap/v4-core/=../lib/v4-core/",
  "@uniswap/v4-periphery/=../lib/v4-periphery/",
  "permit2/=../lib/permit2/",
  "solmate/=../lib/solmate/",
]
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fork tests that move real Arc USDC need Circle's Arc-aware Foundry (scripts/test-arc-fork.sh); standard forge skips them.
no_match_path = "test/fork/**"

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"

# Used only by scripts/test-arc-fork.sh with arc-foundry `--network arc`: includes test/fork.
[profile.arcfork]
no_match_path = "test/__none__/**"
