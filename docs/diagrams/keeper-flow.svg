<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 630" role="img" aria-labelledby="keeper-t keeper-d" font-family="system-ui, Helvetica, Arial, sans-serif">
<title id="keeper-t">Coverage keeper flow</title>
<desc id="keeper-d">The keeper polls every 10 to 15 seconds, reads BTC atoms, price and debt, and computes V. It checks whether coverage is at or below 160 percent, maturity is reached, or a queue action is pending. If not, it loops back to reading state. If yes, it simulates one action, sends one transaction, waits for the receipt, refreshes state, and returns to polling.</desc>
<defs><marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b1915"/></marker></defs>
<rect x="16" y="12" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="37" font-size="14" font-weight="700" fill="#1b1915" text-anchor="middle">Poll every 10 to 15 seconds</text>
<line x1="170" y1="52" x2="170" y2="72" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="72" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="97" font-size="14" fill="#1b1915" text-anchor="middle">Read BTC atoms, price, D = P + M</text>
<line x1="170" y1="112" x2="170" y2="132" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="132" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="157" font-size="14" fill="#1b1915" text-anchor="middle">Compute V = floor(atoms × price ÷ 1e8)</text>
<line x1="170" y1="172" x2="170" y2="190" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<polygon points="170,191 300,236 170,281 40,236" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="232" font-size="14" fill="#1b1915" text-anchor="middle">V/D ≤ 160%, maturity,</text>
<text x="170" y="254" font-size="14" fill="#1b1915" text-anchor="middle">or queue action?</text>
<path d="M300,236 H328 V92 H324" fill="none" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<text x="306" y="228" font-size="13" fill="#4b473f">No</text>
<line x1="170" y1="281" x2="170" y2="328" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<text x="178" y="308" font-size="13" fill="#4b473f">Yes</text>
<rect x="16" y="330" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="355" font-size="14" fill="#1b1915" text-anchor="middle">Simulate the single candidate action</text>
<line x1="170" y1="370" x2="170" y2="390" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="392" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="417" font-size="14" fill="#1b1915" text-anchor="middle">Send one transaction (maxFee ≥ 20 gwei)</text>
<line x1="170" y1="432" x2="170" y2="452" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="454" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="479" font-size="14" fill="#1b1915" text-anchor="middle">Wait for receipt</text>
<line x1="170" y1="494" x2="170" y2="514" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="516" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="541" font-size="14" fill="#1b1915" text-anchor="middle">Refresh authoritative state</text>
<line x1="170" y1="556" x2="170" y2="576" stroke="#1b1915" stroke-width="2" marker-end="url(#ah4)"/>
<rect x="16" y="578" width="308" height="40" rx="3" fill="#fdfbf6" stroke="#1b1915" stroke-width="1.5"/>
<text x="170" y="603" font-size="14" fill="#1b1915" text-anchor="middle">Return to next poll</text>
</svg>
